# Builds the site and publishes it to GitHub Pages.
#
# Setup: Settings -> Pages -> Source: "GitHub Actions".
#
# NUXT_APP_BASE_URL must match where the site is served from. For a project
# site at https://<user>.github.io/<repo>/ keep the line below; for a user site
# or a custom domain, delete it. A wrong value breaks every asset URL.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      # No `version:` here: the pnpm version comes from `packageManager` in
      # package.json. Setting both fails with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22        # keep in sync with engines.node
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + generate + assertions on the generated HTML
      - run: pnpm check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
