# Builds the site and deploys it to Cloudflare Pages.
#
# GitHub Actions builds the site and uploads only .output/public; the source
# repository can stay private. The site is public at <project>.pages.dev (or
# your custom domain). Free-tier hosting and GitHub Actions usage limits apply.
#
# Setup: create a Pages Direct Upload project with production branch `main`.
# Set --project-name below to its name.
# Secrets: CLOUDFLARE_API_TOKEN (Pages edit permission), CLOUDFLARE_ACCOUNT_ID.
name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=__SLUG__
