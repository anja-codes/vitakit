# Builds the site and deploys static assets to Cloudflare Workers (not Pages).
# wrangler.json points exclusively to .output/public. No Worker script or SSR.
# Setup: enable your account's workers.dev subdomain and choose an available
# Worker name in wrangler.json, or configure a custom domain there.
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts edit permission),
#          CLOUDFLARE_ACCOUNT_ID. The source repository can stay private.
name: Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
