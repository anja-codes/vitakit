name: Docs

on:
  push:
    branches: [main]
    # Twoslash checks the snippets against the package's types, so changes to
    # the package itself can break (and must rebuild) the docs too.
    paths:
      - docs/**
      - src/**
      - build.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but a running
# deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Provides the site's base path: "/vitakit" on anja-codes.github.io,
      # "" once a custom domain is configured.
      - id: pages
        uses: actions/configure-pages@v6

      # Twoslash reads the package's types from dist/, so build it first.
      - run: pnpm build
      - run: pnpm --filter ./docs build --base "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
